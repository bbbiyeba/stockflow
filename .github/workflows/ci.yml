name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Format (black)
        run: black --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Tests (unit + integration) with coverage
        run: pytest --cov --cov-report=term --cov-fail-under=85
      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r src data app.py run_pipeline.py scripts
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
