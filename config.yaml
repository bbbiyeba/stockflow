# Central configuration for the inventory analytics pipeline.
# All paths are relative to the project root (the folder containing this file).

paths:
  raw_dir: data/raw              # generated (or real) source CSVs
  processed_dir: data/processed  # cleaned parquet files
  output_dir: outputs            # forecasts, policies, transfer recommendations
  reports_dir: reports           # metrics tables and figures
  decisions_dir: decisions       # planner approve/reject log (written by the dashboard only)

# ---------------------------------------------------------------------------
# 0. Synthetic data generation
# ---------------------------------------------------------------------------
data:
  seed: 42
  n_branches: 25
  n_skus: 300
  start_date: "2023-10-01"
  end_date: "2026-09-30"        # 3 years of daily history; "today" is the day after
  assortment_coverage: [0.35, 0.95]  # share of branches carrying a SKU (slow movers -> low end)
  chunk_series: 60000            # series simulated per chunk (bounds memory; whole SKUs per chunk)
  raw_format: csv                # csv | parquet (use parquet for large networks)
  write_truth: true              # ground truth for validating cleaning (skipped above 20k series)
  quality_issues:
    outage_branch_day_rate: 0.004   # whole branch-days missing from the sales extract
    random_row_drop_rate: 0.002     # individual rows missing
    outlier_rate: 0.0003            # keying errors (qty x10..x50)
    return_rate: 0.0005             # negative quantities (customer returns)
    duplicate_rate: 0.0005          # duplicated rows
    bad_adjustment_rate: 0.00005    # large erroneous negative stock adjustments
    missing_snapshot_rate: 0.01     # weekly on-hand snapshots that never landed

# ---------------------------------------------------------------------------
# 1. Forecasting
# ---------------------------------------------------------------------------
prep:
  bucket_series: 30000           # series cleaned / forecast per bucket (bounds memory)
  duckdb_memory_limit: 4GB       # DuckDB spills to disk above this during ingest
  outlier_q99_multiple: 3.0      # value > this x the series' 99th pct of positive sales => keying error
  outlier_min_qty: 10            # never flag values below this as outliers
  max_plausible_adjustment: 10   # negative adjustments above this AND above prior stock = keying error
  impute_weeks: 4                # same-weekday lookback used to impute missing days
  stagnant_days: 90              # no sales for this many days => stagnant stock

forecast:
  horizon: 28
  backtest_folds: 4              # rolling origins, each `horizon` days apart
  seasonal_period: 7
  moving_average_window: 28
  lgbm_train_days: 540           # training window (days) per fold
  lgbm_max_train_rows: 4000000   # cap on training rows; larger networks are sampled (series x days)
  lgbm_params:
    objective: tweedie
    tweedie_variance_power: 1.2
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 200
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    verbose: -1
  lgbm_num_boost_round: 350
  selection_metric: wape         # metric used to pick the best model per segment
  quantiles: [0.1, 0.5, 0.9]
  bias_flag_threshold: 0.05      # |bias| above this is flagged in reports/bias_check.csv
  cold_start_days: 56            # series with less history get the peer-based cold-start forecast
  explain_steps: [0, 7, 14, 21]  # horizon days averaged for SHAP explanations
  warm_start: false              # continue training the previous model (hash-verified) instead of refitting
  warm_start_rounds: 100
  write_csv: true                # also write outputs/forecasts.csv (Parquet is always written)

policy:
  service_level: 0.95            # cycle service level used for safety stock
  review_period_days: 14         # R in the order-up-to level (ROP + R days of demand)
  stockout_risk_threshold: 0.20  # flag if P(lead-time demand > on hand) exceeds this
  liquidation_days_of_supply: 365  # stagnant + network stock lasting longer than this => liquidate

# ---------------------------------------------------------------------------
# 2. Rebalancing optimizer
# ---------------------------------------------------------------------------
optimizer:
  excess_cost_min_days: 28       # excess is charged holding+obsolescence for its expected
  excess_cost_max_days: 365      # time-to-sell-through, clipped to this range (stagnant = max)
  sender_floor: rop              # "safety_stock" or "rop": lowest level a sender may be drawn down to
  min_transfer_units: 3          # skip moves smaller than this ...
  min_transfer_value: 50.0       # ... or worth less than this ($ at cost); the larger applies
  max_transit_days: 4
  same_region_only: false        # hard constraint
  cross_region_penalty: 0.50     # $/unit soft penalty when same_region_only is false
  stockout_cost_multiplier: 0.6  # lost margin + expediting, as a multiple of unit cost
  safety_stock_tier_weight: 0.35 # shortfall in the safety-stock tier is worth this share of a lost unit
  obsolescence_multiplier_stagnant: 3.0  # stagnant excess carries this multiple of the SKU's obsolescence risk
  max_senders_per_receiver: 8    # arc pruning: keep each receiver's k cheapest senders ...
  max_receivers_per_sender: 8    # ... and each sender's k cheapest receivers
  batch_arcs: 20000              # SKUs are solved in batches of about this many arcs
  solver_time_limit_s: 60        # per batch; best feasible solution is kept, greedy if none
  solver_gap: 0.005

# ---------------------------------------------------------------------------
# 3. Monitoring (python -m src.monitoring --actuals new_sales.csv)
# ---------------------------------------------------------------------------
monitoring:
  wape_degradation: 0.20         # alert if live WAPE > baseline x (1 + this)
  bias_limit: 0.10               # alert if |live bias| exceeds this
  coverage_tolerance: 0.10       # alert if P10-P90 coverage is outside 0.80 +/- this
  psi_limit: 0.25                # alert if demand PSI vs training exceeds this
