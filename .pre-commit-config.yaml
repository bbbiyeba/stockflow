repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: detect-private-key
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy src   # project interpreter, so pandas-stubs are used
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -q -c pyproject.toml -r src data app.py run_pipeline.py scripts
        language: system
        pass_filenames: false
        types: [python]
