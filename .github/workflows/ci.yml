name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Format (black)
        run: black --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Tests (unit + integration) with coverage
        run: pytest --cov --cov-report=term --cov-fail-under=85
      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r src data app.py run_pipeline.py scripts
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    # builds the published Dockerfile unmodified, runs the whole pipeline inside it and checks the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t stockflow .
      - name: Run the pipeline in the container
        run: |
          VOLS="-v sf-raw:/app/data/raw -v sf-processed:/app/data/processed -v sf-outputs:/app/outputs -v sf-reports:/app/reports -v sf-decisions:/app/decisions"
          echo "VOLS=$VOLS" >> "$GITHUB_ENV"
          docker run --rm $VOLS stockflow python run_pipeline.py --skip-sensitivity
      - name: Dashboard serves the results
        run: |
          docker run -d --name dash -p 8501:8501 $VOLS stockflow
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' dash | grep -qx healthy
          curl -fsS http://localhost:8501/_stcore/health
          docker logs dash 2>&1 | tee dash.log
          ! grep -E "Traceback|Error" dash.log
