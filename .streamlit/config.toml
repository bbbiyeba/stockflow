# Palette is mirrored in src/ui_theme.py - change both together.
[theme]
base = "light"
primaryColor = "#0b6e69"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f9"
textColor = "#1f2933"
font = "sans serif"
borderColor = "#e4e7eb"
showWidgetBorder = true
baseRadius = "small"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
enableStaticServing = true   # serves ./static (bundled map outlines, no CDN call)
maxUploadSize = 5

[browser]
gatherUsageStats = false
